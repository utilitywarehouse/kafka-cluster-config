name: Checks
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: write # Granting only the permission needed to commit and push
      statuses: write
      id-token: write # Needed to request the OIDC token for vault-action's jwt auth
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{github.head_ref}}
          fetch-depth: 0
      - name: Fetch Github Tokens
        id: fetch-github-tokens
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: github-jwt
          exportEnv: false
          role: kafka_cluster_config_rw
          secrets: |
            /github/token/kafka_cluster_config_rw token | GITHUB_KCC_TOKEN ;

      - name: Check if we need to update generated files
        id: update-generated-file
        env:
          GITHUB_KCC_TOKEN: ${{ steps.fetch-github-tokens.outputs.GITHUB_KCC_TOKEN }}
        run: |
          make generate
          git add .
          # Check if there are any staged changes
          if ! git diff --staged --exit-code; then
            echo "Generated files are out of date on branch '${{ github.ref_name }}'. Committing and pushing changes."
            git config user.name "GITHUB ACTIONS AUTOMATED USER"
            git config user.email "noreply@uw.co.uk"
            git remote set-url origin "https://x-access-token:${GITHUB_KCC_TOKEN}@github.com/${{ github.repository }}.git"
            git commit -m "[AUTOMATED]: generate files"
            git push
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            echo "Generated files are up to date."
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          cache: true
          tflint_config_path: '.tflint-*.hcl'
      - name: Run pre-commit checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make hooks-pre-commit-run
      - name: Create commit status
        if: steps.update-generated-file.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/statuses/${{ steps.update-generated-file.outputs.sha }} \
            -f 'target_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f 'context=${{ github.job }}' \
            -f 'state=${{ steps.update-generated-file.outcome && 'success' || 'failure' }}' \
            -f 'description=${{ steps.update-generated-file.outcome }}'
      - name: Revoke token
        if: always() # always runs at the end regardless of the previous steps result
        run: |
          curl -sSL -H "Authorization: Bearer ${GITHUB_KCC_TOKEN}" -X DELETE https://api.github.com/installation/token
        env:
          GITHUB_KCC_TOKEN: ${{ steps.fetch-github-tokens.outputs.GITHUB_KCC_TOKEN }}
